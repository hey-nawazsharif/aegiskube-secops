apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aegiskube-secops
  namespace: security-monitoring
  labels:
    app: aegiskube-secops
    version: "1.0.0"
    component: security-sentinel
    part-of: aegiskube-secops
  annotations:
    description: "AegisKube-SecOps Security Sentinel — deployed on every node"
    author: "Nawaz Sharif <contact@nawazsharif.in>"
spec:
  selector:
    matchLabels:
      app: aegiskube-secops
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: aegiskube-secops
        version: "1.0.0"
      annotations:
        # Force pod restart on config change
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # ── Security Context ──────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: false       # Requires host-level access for full audit
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: aegiskube-secops-sa
      hostPID: true               # Required to inspect host processes
      hostNetwork: false
      tolerations:
        # Deploy on all nodes including masters/control-plane
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: PreferNoSchedule
      priorityClassName: system-node-critical

      # ── Init Container: Wait for node readiness ───────────────────────────
      initContainers:
        - name: wait-for-node
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Node ready — starting AegisKube-SecOps sentinel'; sleep 5"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      # ── Main Container ────────────────────────────────────────────────────
      containers:
        - name: aegiskube-secops
          image: ghcr.io/nawaz-sharif/aegiskube-secops:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - src/main.py
            - --full
            - --ledger
            - /data/aegiskube_ledger.json
            - --save-json
            - /data/aegiskube_report.json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AEGISKUBE_LOG_LEVEL
              value: "INFO"
            - name: AEGISKUBE_SCAN_INTERVAL
              value: "300"    # Seconds between scans
            - name: AEGISKUBE_BLOCKCHAIN_DIFFICULTY
              value: "2"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          # ── Volume Mounts ────────────────────────────────────────────────
          volumeMounts:
            - name: host-proc
              mountPath: /proc
              readOnly: true
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
            - name: host-run
              mountPath: /host/run
              readOnly: true
            - name: data-volume
              mountPath: /data
          # ── Resources ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # ── Security Context ─────────────────────────────────────────────
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_PTRACE      # Process inspection
                - NET_ADMIN       # Network socket enumeration
                - SYS_ADMIN       # sysctl reads
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          # ── Health Checks ─────────────────────────────────────────────────
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /data/aegiskube_ledger.json
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5

      # ── Volumes ───────────────────────────────────────────────────────────
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        - name: data-volume
          emptyDir:
            sizeLimit: 500Mi

      # ── DNS & Scheduling ──────────────────────────────────────────────────
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# RBAC: Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegiskube-secops-sa
  namespace: security-monitoring
  labels:
    app: aegiskube-secops

---
# RBAC: ClusterRole — read-only access to node & pod info
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegiskube-secops-role
  labels:
    app: aegiskube-secops
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
# RBAC: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegiskube-secops-binding
  labels:
    app: aegiskube-secops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegiskube-secops-role
subjects:
  - kind: ServiceAccount
    name: aegiskube-secops-sa
    namespace: security-monitoring

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: security-monitoring
  labels:
    name: security-monitoring
    pod-security.kubernetes.io/enforce: "privileged"
    pod-security.kubernetes.io/audit: "restricted"
    pod-security.kubernetes.io/warn: "restricted"

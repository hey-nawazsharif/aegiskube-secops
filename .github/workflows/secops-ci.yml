name: AegisKube-SecOps CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_full_audit:
        description: "Run extended audit suite"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aegiskube-secops

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Code Quality — Lint & Format
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Code Quality & Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install flake8 pylint mypy black isort bandit

      - name: Check code formatting (black)
        run: |
          black --check --diff src/
        continue-on-error: true

      - name: Check import ordering (isort)
        run: |
          isort --check-only --diff src/
        continue-on-error: true

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Enforce line length & style as warnings
          flake8 src/ \
            --count \
            --max-line-length=100 \
            --max-complexity=12 \
            --statistics \
            --exit-zero

      - name: Security lint with bandit
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            --format txt \
            --exit-zero

      - name: Type checking with mypy
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            --python-version 3.12
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Demo Smoke Test — Core pipeline validation
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: "🚀 Demo Pipeline Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: "🛡️  Run AegisKube-SecOps Demo Pipeline"
        id: demo_run
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AegisKube-SecOps — Demo Pipeline Validation"
          echo "  Python: ${{ matrix.python-version }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          python3 src/main.py --demo --save-json /tmp/aegiskube_report.json

      - name: Validate JSON report output
        run: |
          python3 - << 'EOF'
          import json, sys
          try:
              with open("/tmp/aegiskube_report.json") as f:
                  data = json.load(f)
              assert "audit" in data, "Missing 'audit' key"
              assert "detection" in data, "Missing 'detection' key"
              assert "ledger" in data, "Missing 'ledger' key"
              audit = data["audit"]
              assert audit["hostname"], "hostname missing"
              detection = data["detection"]
              assert isinstance(detection["composite_threat_score"], (int, float))
              ledger = data["ledger"]
              assert ledger["chain_valid"], f"Blockchain integrity FAILED!"
              assert ledger["chain_length"] > 1, "Ledger too short"
              print(f"✅ JSON report valid — Risk Score: {audit['overall_risk_score']}, "
                    f"ZT Score: {detection['composite_threat_score']}, "
                    f"Chain: {ledger['chain_length']} blocks, "
                    f"Integrity: {ledger['chain_valid']}")
          except Exception as e:
              print(f"❌ Validation failed: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegiskube-report-py${{ matrix.python-version }}
          path: /tmp/aegiskube_report.json
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Module Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 Module Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov 2>/dev/null || pip install pytest pytest-cov

      - name: Test Blockchain Ledger
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(0, "src")
          from blockchain_audit_ledger import BlockchainAuditLedger, Block
          import time

          # Test 1: Genesis block creation
          ledger = BlockchainAuditLedger(difficulty=1)
          assert ledger.chain_length == 1, "Genesis block missing"
          print("✅ Test 1 passed: Genesis block creation")

          # Test 2: Add alert and verify chain
          block = ledger.add_alert("SSH_BRUTE_FORCE", {"ip": "1.2.3.4"}, "HIGH")
          assert ledger.chain_length == 2
          print("✅ Test 2 passed: Alert block appended")

          # Test 3: Integrity verification
          valid, errors = ledger.verify_integrity()
          assert valid, f"Chain should be valid, errors: {errors}"
          print("✅ Test 3 passed: Chain integrity verified")

          # Test 4: Tamper detection
          ledger._chain[1].payload["ip"] = "TAMPERED"
          valid, errors = ledger.verify_integrity()
          assert not valid, "Tampered chain should fail verification"
          print("✅ Test 4 passed: Tamper detection works correctly")

          print("\n🎉 All blockchain tests passed!")
          EOF

      - name: Test AI Threat Detector
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(0, "src")
          from ai_threat_detector import AiThreatDetector, run_detection, generate_demo_metrics

          # Test 1: Pattern detection
          detector = AiThreatDetector()
          events = detector.analyze_logs([
              "Failed password for root from 1.2.3.4 port 22 ssh2",
              "Failed password for root from 1.2.3.4 port 22 ssh2",
          ])
          assert len(events) == 2, f"Expected 2 events, got {len(events)}"
          assert events[0].source_ip == "1.2.3.4"
          print("✅ Test 1 passed: SSH brute force pattern detected")

          # Test 2: Full demo pipeline
          result = run_detection(demo_mode=True)
          assert result["composite_threat_score"] > 0
          assert len(result["events_detected"]) > 0
          assert len(result["network_anomalies"]) > 0
          print(f"✅ Test 2 passed: Demo detection score={result['composite_threat_score']}")

          # Test 3: Network anomaly detection
          metrics = generate_demo_metrics()
          anomalies = detector.analyze_network(metrics)
          assert len(anomalies) > 0, "Should detect injected anomalies"
          print(f"✅ Test 3 passed: {len(anomalies)} network anomalies detected")

          print("\n🎉 All AI detection tests passed!")
          EOF

      - name: Test Linux Hardening Auditor
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(0, "src")
          from linux_hardening_audit import run_audit

          # Demo mode audit (safe on all platforms)
          result = run_audit(demo_mode=True)
          assert result["hostname"], "Hostname missing"
          assert isinstance(result["overall_risk_score"], float)
          assert len(result["sysctl_findings"]) > 0
          assert len(result["rootkit_findings"]) > 0
          assert len(result["ssh_findings"]) > 0
          print(f"✅ Audit test passed: risk_score={result['overall_risk_score']}")
          print(f"   Findings: {len(result['sysctl_findings'])} sysctl, "
                f"{len(result['ssh_findings'])} SSH, "
                f"{len(result['rootkit_findings'])} rootkit indicators")

          print("\n🎉 All auditor tests passed!")
          EOF

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Docker Image Build
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Image Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [smoke-test, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.pushed_at }}

      - name: Run container smoke test
        run: |
          docker run --rm \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --demo | head -50
          echo "✅ Container smoke test passed"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 5: Publish Docker Image (on tag push to main)
  # ────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: "📦 Publish Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 6: Security Dependency Scan
  # ────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: "🔐 Dependency Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit safety

      - name: Audit dependencies with pip-audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format markdown --exit-zero || true
          else
            echo "No requirements.txt found — skipping pip-audit"
          fi

      - name: Check for known vulnerabilities with safety
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --exit-zero || true
          else
            echo "No requirements.txt found — skipping safety check"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 7: SBOM Generation
  # ────────────────────────────────────────────────────────────────────────────
  sbom:
    name: "📋 Generate SBOM"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          artifact-name: aegiskube-secops-sbom.spdx.json
          format: spdx-json

  # ────────────────────────────────────────────────────────────────────────────
  # Summary Badge
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: "✅ CI Status"
    runs-on: ubuntu-latest
    needs: [lint, smoke-test, unit-tests, docker-build, dependency-scan]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "CI Pipeline Results:"
          echo "  Lint:             ${{ needs.lint.result }}"
          echo "  Smoke Test:       ${{ needs.smoke-test.result }}"
          echo "  Unit Tests:       ${{ needs.unit-tests.result }}"
          echo "  Docker Build:     ${{ needs.docker-build.result }}"
          echo "  Dependency Scan:  ${{ needs.dependency-scan.result }}"
          if [[ "${{ needs.smoke-test.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "❌ Critical jobs failed — CI FAILED"
            exit 1
          fi
          echo "✅ AegisKube-SecOps CI Pipeline PASSED"
